*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#fff;color:#000;font-family:"Barlow",system-ui,sans-serif;line-height:1.4}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;line-height:1.08}
button{font-family:"Barlow Condensed",sans-serif}
.deck{height:100%;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding:32px clamp(14px,5vw,60px) 90px;display:none}
.slide.on{display:block}
.inner{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:18px;gap:12px}
.top small{font-family:"Barlow Condensed";font-weight:600;white-space:nowrap}
.cover h1{font-size:clamp(2.2rem,6.5vw,4.2rem);font-weight:700}
.cover p{max-width:66ch}
.tree{margin:28px 0 0;text-align:center}
.node{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid #000;padding:6px 12px 8px;background:#fff}
.node svg{width:84px;height:74px}
.node b{font-family:"Barlow Condensed";font-size:1.15rem}
.stem{width:2px;height:18px;background:#000;margin:0 auto}
.jemge{font-family:"Barlow Condensed";font-weight:600;border:1.5px dashed #000;display:inline-block;padding:4px 12px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;padding-top:18px}
.row::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:#000}
.row button{all:unset;cursor:pointer;position:relative;display:block}
.row button::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:#000}
.row .node{width:100%}
.row button:focus-visible .node,.row button:hover .node{outline:3px solid #000;outline-offset:2px}
.gub-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.gub-head svg{width:92px;height:80px;flex:none}
.gub-head h2{font-size:clamp(1.5rem,3.6vw,2.3rem)}
.gub-head p{margin:2px 0 0}
.subhead{font-family:"Barlow Condensed";font-weight:600;font-size:1.15rem;margin:16px 0 6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.u{border:1px solid #bbb;padding:4px 4px 8px;text-align:center;position:relative;background:#fff}
.u svg{width:78px;height:68px;display:block;margin:0 auto}
.u span{display:block;font-size:.8rem;font-weight:500;line-height:1.2}
.u em{display:block;font-style:normal;font-size:.72rem;color:#444;margin-top:2px}
.u.sec::after{content:"†";position:absolute;top:2px;right:6px;font-weight:700}
.ctl{display:flex;justify-content:space-between;align-items:end;margin-top:14px;gap:10px}
.btn{font:600 .95rem "Barlow Condensed";background:#fff;color:#000;border:1.5px solid #000;padding:3px 10px;cursor:pointer}
.btn[aria-pressed="true"]{background:#000;color:#fff}
.btn:focus-visible{outline:3px solid #000;outline-offset:2px}
details.br{margin-top:8px;border:1.5px solid #000}
details.br summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px 10px}
details.br summary::-webkit-details-marker{display:none}
details.br summary svg{width:66px;height:58px;flex:none}
details.br summary h3{font-size:1.3rem}
details.br summary p{margin:0;font-size:.9rem}
.tog{margin-left:auto;font-family:"Barlow Condensed";font-size:1.7rem;transition:transform .2s}
details.br[open] .tog{transform:rotate(45deg)}
details.br[open] summary{border-bottom:1px solid #000}
details.br summary:focus-visible{outline:3px solid #000}
details.br .units{padding:10px}
.notes{max-width:78ch;font-size:.92rem;padding-left:18px}
.notes li{margin-bottom:6px}
.notes a{color:#000}
/* mapa */
.maplay{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.mapbox{border:1.5px solid #000;position:relative}
.mapbox>svg{display:block;width:100%;height:auto;max-height:76vh;touch-action:manipulation}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips .lbl{font:600 .9rem "Barlow Condensed";align-self:center;margin-right:2px}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible{outline:2px solid #000}
.gl{font-family:"Barlow Condensed",sans-serif;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.panel{border:1.5px solid #000;padding:10px 12px;min-height:200px}
.panel h3{font-size:1.4rem}
.panel .hint{color:#444;margin:4px 0 0}
.plist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.plist li{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding-bottom:4px}
.plist svg{width:52px;height:46px;flex:none}
.plist b{font-weight:600}
.plist small{display:block;color:#444}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;margin-top:8px;align-items:center}
.mleg svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
/* navegación */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid #000;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;z-index:5}
nav .btn{font-size:1.05rem;padding:4px 14px;min-width:44px;min-height:36px}
nav .btn:disabled{opacity:.3;cursor:default}
.pdfbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#000!important;color:#fff!important}
.pdfbtn::before{content:'';width:10px;height:12px;border:1.5px solid currentColor;border-radius:1px;box-sizing:border-box}
.pdfrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pdfrow a{text-decoration:none;display:inline-flex;align-items:center}
#count{font-family:"Barlow Condensed";font-weight:600;min-width:52px;text-align:center}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border:1.5px solid #000;border-radius:50%;cursor:pointer}
.dots i.on{background:#000}
@media (max-width:760px){
  .maplay{grid-template-columns:1fr}
  .mapbox>svg{max-height:62vh}
}
@media (max-width:640px){
  .row{grid-template-columns:repeat(2,1fr);row-gap:26px}
  .row::before{left:25%;right:25%}
  .row button:nth-child(n+3)::before{display:none}
  .units{grid-template-columns:repeat(3,1fr)}
  .u svg{width:64px;height:56px}
  .dots{display:none}
  nav{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  nav{display:none}
  .deck{height:auto;overflow:visible}
  .slide{display:block!important;position:static;page-break-after:always;overflow:visible;padding:20px}
  details.br .units{display:grid}
}

/* logotipos */
.logo{display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);flex:none;box-sizing:border-box;vertical-align:middle}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo:not(.has){border:1.5px dashed #9a9a9a;color:#777;font:600 .68rem/1.1 "Barlow Condensed",sans-serif;text-align:center;padding:2px;overflow:hidden;cursor:pointer}
.logo:not(.has) span{display:block;overflow:hidden;max-height:100%}
body:not(.edit) .logo:not(.has){display:none}
body.edit .logo{cursor:pointer}
body.edit .logo.has{outline:1px dashed #bbb;outline-offset:2px}
.logo:focus-visible{outline:3px solid #000;outline-offset:2px}
.logo.mini{margin-right:8px;vertical-align:-8px}
.logo.mini:not(.has){display:none!important}
.logo.right{margin-left:auto}
.logo.nodelogo{margin-top:6px}
.cover-head{display:flex;align-items:center;gap:18px}
.slotlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:14px}
.slot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;border:1px solid #bbb;padding:8px}
.slot .logo{grid-row:span 2}
.slot .logo:not(.has){display:inline-flex!important}
.slotname{font-weight:600;line-height:1.2}
.slotbtns{display:flex;gap:6px}
@media print{.logo:not(.has){display:none!important}}
body.edit details.br .logo.right + .tog, details.br .logo.right.has + .tog{margin-left:12px}

/* móviles: alto real del visor y áreas seguras */
@supports (height:100dvh){ html,body{height:100dvh} }
.deck{height:100%}
nav{padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}
.slide{padding-bottom:calc(110px + env(safe-area-inset-bottom));padding-left:calc(clamp(14px,5vw,60px) + env(safe-area-inset-left));padding-right:calc(clamp(14px,5vw,60px) + env(safe-area-inset-right));-webkit-overflow-scrolling:touch}
.btn,nav .btn,details.br summary,.logo{touch-action:manipulation}
nav .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
details.br summary{min-height:48px}
.slotbtns .btn{min-height:40px}
@media (max-width:480px){
  nav{gap:6px;flex-wrap:wrap}
  nav .btn{padding:4px 10px}
  .pdfbtn{font-size:.95rem}
  .units{grid-template-columns:repeat(2,1fr)}
  .slotlist{grid-template-columns:1fr}
}
</style>
</head>

try { LOGOS = JSON.parse(document.getElementById("logodata").textContent || "{}"); } catch(e) { LOGOS = {}; }
try { const st = localStorage.getItem("orbat-logos"); if (st) Object.assign(LOGOS, JSON.parse(st)); } catch(e) {}
function saveLogos(){ try { localStorage.setItem("orbat-logos", JSON.stringify(LOGOS)); } catch(e) {} }
const slug = s => "br-" + s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const logo = (id, label, size, extra="") => {
  const src = LOGOS[id];
  return `<span class="logo${src?" has":""}${extra}" data-logo="${id}" data-label="${label}" style="--s:${size}px" role="button" tabindex="0" aria-label="Logotipo ${label}${src?"":" (vacío, tocar para cargar)"}">${src?`<img src="${src}" alt="Logotipo ${label}">`:`<span>Logo<br>${label}</span>`}</span>`;
};

function sym(icon, ech, mods=[], hqText="", dashed=false){
  const inner = (ICON[icon]||"") + mods.map(m=>MOD[m]||"").join("") + (hqText ? txt(hqText,25,hqText.length>4?11:14) : "");

      <rect x="0" y="0" width="60" height="40" fill="${FILL}"${dashed?' stroke-dasharray="6 4"':''}/>${inner}</g></svg>`;
}

    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      if (file.type === "image/svg+xml") return res(fr.result);
      const img = new Image();
      img.onload = () => {
        const M = 360, r = Math.min(1, M / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*r); cv.height = Math.round(img.height*r);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/png"));
      };
      img.onerror = () => rej(new Error("imagen no válida"));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* mapa */
let filt = "all", view = "País";
const svgMap = document.getElementById("map");
function drawLabels(){
  const k = GEO.views[view][2] / GEO.W;
  document.getElementById("maplab").innerHTML = Object.entries(GEO.lab).filter(([,p])=>p)
    .map(([n,p])=>`<text x="${p[0]}" y="${p[1]}" font-size="${(n==="Islas Malvinas"?15:18)*Math.max(k,0.45)}">${n}</text>`).join("");
}
function drawMarks(){
  const vb = GEO.views[view];
  const full = view !== "País";
  const rc = svgMap.getBoundingClientRect();
  const upp = rc.width > 0 ? Math.max(vb[2]/rc.width, vb[3]/rc.height) : vb[2]/GEO.W * 1.6;
  const k = upp / 1.6;
  const S = (full ? 36 : 32) * upp;
  const SH = S * 70 / 80;
  const fs = (full ? 11.5 : 10.5) * upp;
  const list = [];
  Object.values(GARR).forEach(g => {
    const items = filt==="all" ? g.items : g.items.filter(i=>i.gub===filt);
    if (!items.length) return;
    const [x,y] = GEO.pts[g.name];
    const main = items.slice().sort((a,b)=>b.pri-a.pri)[0];
    const hq = items.some(i=>i.hq);
    const inV = x >= vb[0] && x <= vb[0]+vb[2] && y >= vb[1] && y <= vb[1]+vb[3];
    list.push({name:g.name, items, x, y, main, hq, symb: inV && (full || hq)});
  });
  list.sort((a,b)=> (b.symb-a.symb) || (b.main.pri-a.main.pri) || (b.items.length-a.items.length));
  const placed = [];
  const dotR = 2.4 * k;
  const hit = (b, self) => placed.some(p => b.x < p.x+p.w && b.x+b.w > p.x && b.y < p.y+p.h && b.y+b.h > p.y)
    || list.some(o => o!==self && o.x > b.x-dotR && o.x < b.x+b.w+dotR && o.y > b.y-dotR && o.y < b.y+b.h+dotR);
  const inside = b => b.x >= vb[0] && b.y >= vb[1] && b.x+b.w <= vb[0]+vb[2] && b.y+b.h <= vb[1]+vb[3];
  const out = [], dotsSvg = [];
  list.forEach(o => {
    const sel = o.name===selName;
    dotsSvg.push(`<circle cx="${o.x}" cy="${o.y}" r="${dotR}" fill="#000"/>`);
    const lbl = `aria-label="${o.name}, ${o.items.length} elementos" data-g="${o.name}"`;
    if (!o.symb) {
      out.push(`<g class="mk${sel?" sel":""}" tabindex="0" role="button" ${lbl}>
        <circle cx="${o.x}" cy="${o.y}" r="${dotR*3.2}" fill="transparent"/>
        ${sel?`<circle cx="${o.x}" cy="${o.y}" r="${dotR*2.4}" fill="none" stroke="#000" stroke-width="${1.2*k}"/><text class="gl" x="${o.x+dotR*3}" y="${o.y+fs*0.35}" font-size="${fs}">${o.name}</text>`:""}
      </g>`);
      return;
    }
    const tw = o.name.length * fs * 0.48;
    const w = Math.max(S, tw), h = SH + fs * 1.15;
    const gap = S * 0.22;
    const cands = [];
    [1, 1.9, 2.8, 3.8, 5].forEach(m => {
      const dx = (w/2 + gap) * m, dy = (h/2 + gap) * m;
      [[0,-dy],[dx,-dy*.6],[-dx,-dy*.6],[dx,0],[-dx,0],[0,dy],[dx,dy*.6],[-dx,dy*.6]].forEach(c=>cands.push(c));
    });
    const mk = ([dx,dy]) => ({x:o.x+dx-w/2, y:o.y+dy-h/2, w, h});
    const segClear = b => {
      const tx = Math.min(Math.max(o.x, b.x), b.x+b.w), ty = Math.min(Math.max(o.y, b.y), b.y+b.h);
      const vx = tx-o.x, vy = ty-o.y, L = vx*vx+vy*vy || 1;
      return !list.some(q => { if (q===o) return false; const t = Math.max(0, Math.min(1, ((q.x-o.x)*vx+(q.y-o.y)*vy)/L));
        return Math.hypot(o.x+t*vx-q.x, o.y+t*vy-q.y) < dotR*2.5; });
    };
    const bs = cands.map(mk);
    let box = bs.find(b => !hit(b,o) && inside(b) && segClear(b)) || bs.find(b => !hit(b,o) && inside(b)) || bs.find(b => !hit(b,o)) || bs[0];
    placed.push(box);
    const sx = box.x + (w - S)/2, sy = box.y;
    const fx = Math.min(Math.max(o.x, sx + S*0.125), sx + S*0.875);
    const fy = Math.min(Math.max(o.y, sy + SH*0.257), sy + SH*0.829);
    const lw = 0.9 * k;
    const extra = o.items.length - 1;
    const allUnv = o.items.every(i=>i.unv);
    const args = o.main.args.slice(); while (args.length < 3) args.push([]); if (args.length < 4) args.push("");
    out.push(`<g class="mk${sel?" sel":""}" tabindex="0" role="button" ${lbl}>
      <line x1="${o.x}" y1="${o.y}" x2="${fx}" y2="${fy}" stroke="#000" stroke-width="${lw}"/>
      ${sel?`<rect x="${box.x-3*k}" y="${box.y-3*k}" width="${w+6*k}" height="${h+6*k}" fill="#fff" stroke="#000" stroke-width="${lw*1.6}" stroke-dasharray="${3*k} ${2*k}"/>`:""}
      ${symAt(sx, sy, S, [...args.slice(0,4), allUnv])}
      ${extra?`<text x="${sx+S}" y="${sy+SH*0.2}" text-anchor="end" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="${fs*0.95}">+${extra}</text>`:""}
      <text class="gl" x="${box.x+w/2}" y="${sy+SH+fs*0.95}" text-anchor="middle" font-size="${fs}">${o.name}</text>
      <rect x="${box.x}" y="${box.y}" width="${w}" height="${h}" fill="transparent"/>
    </g>`);
  });
  document.getElementById("marks").innerHTML = `<g>${dotsSvg.join("")}</g>` + out.join("");
}
let selName = null;
function showPanel(name){
  selName = name;
  const p = document.getElementById("panel");
  if (!name){
    const n = Object.values(GARR).length, u = Object.values(GARR).reduce((a,g)=>a+g.items.length,0);
    p.innerHTML = `<h3>Seleccioná una guarnición</h3><p class="hint">${n} guarniciones · ${u} comandos y elementos representados.</p>
      <ul class="plist">${Object.values(GARR).sort((a,b)=>b.items.length-a.items.length).slice(0,8)
        .map(g=>`<li><b>${g.name}</b>&nbsp;— ${g.items.length} elementos</li>`).join("")}</ul>
      <p class="hint">Las 8 guarniciones con más elementos.</p>`;
  } else {
    const g = GARR[name];
    const items = filt==="all" ? g.items : g.items.filter(i=>i.gub===filt);
    p.innerHTML = `<h3>${name}</h3><p class="hint">${items.length} elemento${items.length>1?"s":""}${filt!=="all"?" de la "+DATA.find(d=>d.id===filt).tag:""}</p>
      <ul class="plist">${items.map(i=>`<li>${i.sym}<div><b>${i.label}</b><small>${i.sub}${i.unv?" · guarnición no verificada":""}</small></div></li>`).join("")}</ul>`;
  }
  drawMarks();
}
function setView(v){
  view = v; svgMap.setAttribute("viewBox", GEO.views[v].join(" "));

}

    for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type:"application/pdf"}));
    document.querySelectorAll('#pdfBtn,[data-pdf]').forEach(a => { a.href = url; });
